# On every push to main: build dist/SplashTank.html, publish it to GitHub Pages, and run the smoke test.
# One-time setup in the repo: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Build, test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Site files
        run: |
          mkdir -p site
          cp dist/SplashTank.html site/SplashTank.html
          cp dist/SplashTank.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    # headless Chromium with a software GPU; slow but needs no graphics card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: test-output/
